<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dbox2d samples</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #fallback {
    display: none; position: fixed; inset: 0; place-items: center;
    color: #ddd; font: 16px sans-serif; text-align: center;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="fallback">This page needs a browser with WebGPU.</div>
<script>
// The runtime and the binary form a pair: the Go class of tinygo and the one
// of the local go toolchain are not interchangeable.
function selectBuild(params) {
  const build = params.get("build") === "go" ? "go" : "tinygo";
  const mode = params.get("mode") === "float" ? "float" : "fixed";
  if (build === "go") {
    return {
      build, mode,
      exec: "wasm_exec-go.js",
      binary: mode === "float" ? "app-local-go.wasm" : "app-local-go-fixed.wasm",
    };
  }
  // gc=leaking selects the diagnostic build that never collects, to tell a
  // collector pause apart from slow frame work.
  const gc = params.get("gc");
  if (gc === "leaking" || gc === "boehm") {
    // sat=off drops the saturation counter, which the fixed kernels pay per op.
    const sat = params.get("sat") === "off" ? "-nosat" : "";
    return { build, mode, exec: "wasm_exec-tinygo.js", binary: "app-" + mode + "-" + gc + sat + ".wasm" };
  }
  return {
    build, mode,
    exec: "wasm_exec-tinygo.js",
    binary: mode === "float" ? "app-float.wasm" : "app.wasm",
  };
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}

if (!navigator.gpu) {
  document.getElementById("canvas").style.display = "none";
  document.getElementById("fallback").style.display = "grid";
} else {
  // ?mode=fixed loads the fixed build; the default is the float build.
  const mode = new URLSearchParams(location.search).get("mode") === "fixed" ? "fixed" : "float";
  const binary = mode === "fixed" ? "app-fixed.wasm" : "app.wasm";
  document.title = "dbox2d samples (" + mode + ")";
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch(binary), go.importObject).then((result) => {
    // The js backend of the webgpu module reads linear memory through
    // this global when it writes buffers and textures.
    window.wasm = result;
    go.run(result.instance);
  });
}
</script>
</body>
</html>
