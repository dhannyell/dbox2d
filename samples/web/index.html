<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dbox2d samples</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #fallback {
    display: none; position: fixed; inset: 0; place-items: center;
    color: #ddd; font: 16px sans-serif; text-align: center;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="fallback">This page needs a browser with WebGPU.</div>
<script>
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}

if (!navigator.gpu) {
  document.getElementById("canvas").style.display = "none";
  document.getElementById("fallback").style.display = "grid";
} else {
  // The runtime and the binary form a pair. Both come from the Go toolchain,
  // which .github/workflows/pages.yml builds and whose wasm_exec.js it copies
  // out of GOROOT; a binary of one toolchain does not run on the loader of
  // another.
  //
  // ?mode=fixed loads the fixed build; the default is the float build.
  const mode = new URLSearchParams(location.search).get("mode") === "fixed" ? "fixed" : "float";
  const binary = mode === "fixed" ? "app-fixed.wasm" : "app.wasm";
  const threadedBinary = mode === "fixed" ? "app-fixed-mt.wasm" : "app-mt.wasm";
  document.title = "dbox2d samples (" + mode + ")";

  function startSingle() {
    return loadScript("wasm_exec.js").then(() => {
      const go = new Go();
      return WebAssembly.instantiateStreaming(fetch(binary), go.importObject).then((result) => {
        // The js backend of the webgpu module reads linear memory through
        // this global when it writes buffers and textures.
        window.wasm = result;
        go.run(result.instance);
      });
    });
  }

  function startThreaded() {
    return loadScript("wasm_exec-mt.js").then(() => loadScript("threads-host.js")).then(async () => {
      const module = await WebAssembly.compileStreaming(fetch(threadedBinary));
      const go = new Go();
      threadsHost(go, module);
      const instance = await WebAssembly.instantiate(module, go.importObject);
      // TinyGo exports the memory as "memory"; the webgpu module reads "mem".
      window.wasm = { instance: { exports: { mem: instance.exports.memory } } };
      go.run(instance);
    });
  }

  // A page with the COOP and COEP headers has shared memory. It loads the
  // threaded build if that file exists; every other page steps on one worker.
  const threaded = !crossOriginIsolated ? Promise.resolve(false) :
    fetch(threadedBinary, { method: "HEAD" }).then((r) => r.ok, () => false);

  threaded.then((useThreads) => useThreads ? startThreaded() : startSingle()).catch((err) => {
    document.getElementById("canvas").style.display = "none";
    const fallback = document.getElementById("fallback");
    fallback.textContent = err.message;
    fallback.style.display = "grid";
  });
}
</script>
</body>
</html>
