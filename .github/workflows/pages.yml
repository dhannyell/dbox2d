name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: samples/go.mod
      - name: Build the browser host
        working-directory: samples
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: go build -o web/app.wasm ./cmd/web
      - name: Copy wasm_exec.js from the toolchain
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" samples/web/wasm_exec.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
