name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.goarch }}, ${{ matrix.tags || 'fixed' }})
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, "386", wasm]
        tags: ["", dbox2d_float, "dbox2d_float,dbox2d_simd"]
        include:
          - goarch: amd64
            goos: linux
            runner: ubuntu-latest
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
          - goarch: "386"
            goos: linux
            runner: ubuntu-latest
          - goarch: wasm
            goos: js
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.goarch == 'amd64'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        if: matrix.goarch == 'amd64'
        run: go vet ./...
      - name: Guard the scalar layer
        if: (matrix.goarch == 'amd64' || matrix.goarch == 'wasm') && matrix.tags == ''
        shell: bash
        run: |
          leaks="$(grep -rlE 'fixed\.(Q32(Zero|One|Half|FromInt|FromRatio|MustParse|MaxValue|MinValue)|RotIdentity|RotFromTurns|Atan2Turns)\(' --include=*.go --exclude=scalar_fixed.go --exclude=probe_q16_test.go --exclude=probe_wide_test.go . || true)"
          if [ -n "$leaks" ]; then
            printf 'Files bypass the scalar layer:\n%s\n' "$leaks"
            exit 1
          fi
          # MakeRot stays out of the count: its body costs 83, over the budget of 80, since before the layer.
          inlined="$(go build -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (QZero|QOne|QHalf|QFromInt|QFromRatio|QMustParse|QMaxValue|QMinValue|RotIdentity|atan2Turns)$')"
          if [ "$inlined" != "10" ]; then
            echo "expected 10 inlinable constructors, got $inlined"
            exit 1
          fi
      - name: Guard the float mode
        if: matrix.goarch == 'amd64' && matrix.tags == 'dbox2d_float'
        shell: bash
        run: |
          if ! go build -tags dbox2d_float ./... || ! go vet -tags dbox2d_float ./...; then
            echo "float build or vet failed"
            exit 1
          fi
          count="$(GOARCH=arm64 go build -tags dbox2d_float -gcflags=-S . 2>&1 | grep -cE '\b(FMADD|FMSUB|FNMADD|FNMSUB|FMLA|FMLS)\b' || true)"
          if [ "$count" != "0" ]; then
            echo "expected no fused multiply-add instructions, got $count"
            exit 1
          fi
          inlined="$(go build -tags dbox2d_float -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (QZero|QOne|QHalf|QFromInt|QFromRatio|QMustParse|QMaxValue|QMinValue|RotIdentity|atan2Turns)$' || true)"
          if [ "$inlined" != "10" ]; then
            echo "expected 10 inlinable float constructors, got $inlined"
            exit 1
          fi
          methods="$(go build -tags dbox2d_float -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (Q|Vec2)\.(Add|Sub|Mul|Div|Neg|Dot)$' || true)"
          if [ "$methods" != "10" ]; then
            echo "expected 10 inlinable float methods, got $methods"
            exit 1
          fi
          # A package use is fixed.<Identifier>; prose in a comment is not.
          leaks="$(grep -rlE 'fixed\.[A-Z]' --include=*.go --exclude=scalar_fixed.go --exclude=*_test.go --exclude-dir=samples . || true)"
          if [ -n "$leaks" ]; then
            printf 'Unexpected fixed-layer imports in float mode:\n%s\n' "$leaks"
            exit 1
          fi
          if grep -rn 'QFromFloat64\|QToFloat64' --include=*.go . | grep -v '_test.go\|scalar_fixed.go\|scalar_float.go\|samples/camera.go'; then
            echo "float64 conversion helpers leaked into production code"
            exit 1
          fi
          if grep -rl 'go:build' --include=*.go . | grep -v '_test.go\|scalar_fixed.go\|scalar_float.go\|executor.go\|executor_wasm.go\|samples/\|wide_lane_\|wide_guard.go\|wide.go\|wide_off.go\|contact_solver_wide.go\|spin_asm.go\|spin_stub.go'; then
            echo "unexpected build tags found"
            exit 1
          fi
          camera="$(cd samples && (grep -rln 'fixed\.' --include=*.go . | grep -v internal/draw/text.go || true))"
          if [ -n "$camera" ]; then
            printf 'Unexpected fixed imports in samples:\n%s\n' "$camera"
            exit 1
          fi
          epsilon="$(grep -chE 'scalarEpsilon|belowEpsilon|sensorOverlaps' aabb.go geometry.go distance.go manifold.go sensor.go world.go | paste -sd+ | bc)"
          if [ "$epsilon" != "23" ]; then
            echo "expected 23 epsilon references, got $epsilon"
            exit 1
          fi
          guard="$(go build -tags dbox2d_simd . 2>&1 | grep -c wideRequiresFloatMode || true)"
          if [ "$guard" != "1" ]; then
            echo "expected the wide family to require float mode, got $guard"
            exit 1
          fi
          # b2ValidateSolverSets is empty unless B2_VALIDATE is set. The
          # mutation paths must reach it through validateSolverSetsDebug, or
          # a release build pays an O(bodies + joints + contacts) sweep per
          # joint.
          validate="$(grep -rln 'validateSolverSets(' --include=*.go . | grep -v '_test\.go' | grep -vE '^\./(world|validate_debug)\.go$' || true)"
          if [ -n "$validate" ]; then
            printf 'validateSolverSets must be reached through validateSolverSetsDebug:\n%s\n' "$validate"
            exit 1
          fi
      - name: Configure Wasm runner
        if: matrix.goarch == 'wasm'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      # The generic wide path on wasm runs the conformance traces past the
      # timeout; the native jobs and the wide job cover them.
      - name: Test
        run: go test -timeout 600s -tags "${{ matrix.tags }}" -skip "${{ (matrix.goarch == 'wasm' && matrix.tags == 'dbox2d_float,dbox2d_simd') && 'TestConformance' || '^$' }}" ./...
      # The gated validation is off in every other job, so it needs one job
      # that actually runs it.
      - name: Test with the solver-set validation on
        if: matrix.goarch == 'amd64' && matrix.tags == 'dbox2d_float'
        run: go test -timeout 600s -tags "${{ matrix.tags }},dbox2d_validate" ./...

  wide:
    name: wide (${{ matrix.path }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            path: avx2
            fma: 'VFN?M(ADD|SUB)'
            goos: ""
            goarch: ""
          - os: ubuntu-24.04-arm
            path: neon
            fma: '\b(FMADD|FMSUB|FNMADD|FNMSUB|FMLA|FMLS)S?\b'
            goos: ""
            goarch: ""
          - os: ubuntu-latest
            path: simd128
            goos: js
            goarch: wasm
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
      TAGS: dbox2d_float,dbox2d_simd
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # the native host uses cgo; wasm must not try it.
      CGO_ENABLED: ${{ matrix.goos == 'js' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The archsimd API changes between Go releases. Pin the version the
          # wide lanes were written against.
          go-version: "1.27.0"
      - name: Configure Wasm runner
        if: matrix.goos == 'js'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      - name: Path
        shell: bash
        run: |
          go test -tags $TAGS -run TestWidePath -v . | tee /dev/stderr | grep -q 'path: ${{ matrix.path }}'
      - name: Vet
        run: go vet -tags $TAGS ./...
      - name: Test
        # Fixed mode is bit-identical on every target, so the slow scene traces
        # run only on the 64-bit jobs; the witness hashes still cover 386 and wasm.
        run: go test -timeout 600s ${{ matrix.tags == '' && (matrix.goarch == '386' || matrix.goarch == 'wasm') && '-short' || '' }} -tags "${{ matrix.tags }}" ./...

  race:
    name: race (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race the executor
        run: go test -race -timeout 300s -run 'WorkerCount|ParallelFor|Executor|SideTask|Sensor|Counters|PendingSplit' .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        name: Lint fixed mode
        with:
          version: latest
      - uses: golangci/golangci-lint-action@v8
        name: Lint float mode
        with:
          version: latest
          args: --build-tags dbox2d_float ./...
