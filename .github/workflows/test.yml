name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.goarch }}, ${{ matrix.tags || 'float' }})
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, "386", wasm]
        tags: ["", "dbox2d_fixed,fixed_satcounter", dbox2d_simd, "dbox2d_simd,dbox2d_fixed,fixed_satcounter"]
        # This job pins no toolchain and sets no GOEXPERIMENT, so dbox2d_simd
        # here selects the wide solver over the generic lanes, never the real
        # ones: those need goexperiment.simd and Go 1.27, which the wide job
        # supplies. Generic lanes are plain Go and identical on every target,
        # so one architecture covers the wide solver and the rest is runner
        # time. The scalar paths of arm64, 386 and wasm stay fully covered by
        # their two remaining tag sets.
        exclude:
          - goarch: arm64
            tags: dbox2d_simd
          - goarch: arm64
            tags: "dbox2d_simd,dbox2d_fixed,fixed_satcounter"
          - goarch: "386"
            tags: dbox2d_simd
          - goarch: "386"
            tags: "dbox2d_simd,dbox2d_fixed,fixed_satcounter"
          - goarch: wasm
            tags: dbox2d_simd
          - goarch: wasm
            tags: "dbox2d_simd,dbox2d_fixed,fixed_satcounter"
        include:
          - goarch: amd64
            goos: linux
            runner: ubuntu-latest
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
          - goarch: "386"
            goos: linux
            runner: ubuntu-latest
          - goarch: wasm
            goos: js
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.goarch == 'amd64'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        if: matrix.goarch == 'amd64'
        run: go vet ./...
      - name: Guard the scalar layer
        if: (matrix.goarch == 'amd64' || matrix.goarch == 'wasm') && matrix.tags == 'dbox2d_fixed,fixed_satcounter'
        shell: bash
        run: |
          leaks="$(grep -rlE 'fixed\.(Q32(Zero|One|Half|FromInt|FromRatio|MustParse|MaxValue|MinValue)|RotIdentity|RotFromTurns|Atan2Turns)\(' --include=*.go --exclude=scalar_fixed.go . || true)"
          if [ -n "$leaks" ]; then
            printf 'Files bypass the scalar layer:\n%s\n' "$leaks"
            exit 1
          fi
          # MakeRot stays out of the count: its body costs 83, over the budget of 80, since before the layer.
          inlined="$(go build -tags dbox2d_fixed -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (QZero|QOne|QHalf|QFromInt|QFromRatio|QMustParse|QMaxValue|QMinValue|RotIdentity|atan2Turns)$')"
          if [ "$inlined" != "10" ]; then
            echo "expected 10 inlinable constructors, got $inlined"
            exit 1
          fi
      - name: Guard the float mode
        if: matrix.goarch == 'amd64' && matrix.tags == ''
        shell: bash
        run: |
          if ! go build ./... || ! go vet ./...; then
            echo "float build or vet failed"
            exit 1
          fi
          count="$(GOARCH=arm64 go build -gcflags=-S . 2>&1 | grep -cE '\b(FMADD|FMSUB|FNMADD|FNMSUB|FMLA|FMLS)\b' || true)"
          if [ "$count" != "0" ]; then
            echo "expected no fused multiply-add instructions, got $count"
            exit 1
          fi
          # amd64 fuses as well from GOAMD64=v3 up, which is the setting the SIMD builds use.
          count="$(GOAMD64=v3 go build -gcflags=-S . 2>&1 | grep -cE '\bVFN?M(ADD|SUB)[0-9]*(SS|SD|PS|PD)\b' || true)"
          if [ "$count" != "0" ]; then
            echo "expected no fused multiply-add instructions at GOAMD64=v3, got $count"
            exit 1
          fi
          inlined="$(go build -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (QZero|QOne|QHalf|QFromInt|QFromRatio|QMustParse|QMaxValue|QMinValue|RotIdentity|atan2Turns)$' || true)"
          if [ "$inlined" != "10" ]; then
            echo "expected 10 inlinable float constructors, got $inlined"
            exit 1
          fi
          methods="$(go build -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (Q|Vec2)\.(Add|Sub|Mul|Div|Neg|Dot)$' || true)"
          if [ "$methods" != "10" ]; then
            echo "expected 10 inlinable float methods, got $methods"
            exit 1
          fi
          # A package use is fixed.<Identifier>; prose in a comment is not.
          leaks="$(grep -rlE 'fixed\.[A-Z]' --include=*.go --exclude=scalar_fixed.go --exclude=simd_lane_fixed.go --exclude=*_test.go --exclude-dir=samples . || true)"
          if [ -n "$leaks" ]; then
            printf 'Unexpected fixed-layer imports in float mode:\n%s\n' "$leaks"
            exit 1
          fi
          if grep -rn 'QFromFloat64\|QToFloat64' --include=*.go . | grep -v '_test.go\|scalar_fixed.go\|scalar_float.go\|samples/camera.go\|samples/determinism_float.go'; then
            echo "float64 conversion helpers leaked into production code"
            exit 1
          fi
          if grep -rl 'go:build' --include=*.go . | grep -v '_test.go\|scalar_fixed.go\|scalar_float.go\|executor.go\|executor_wasm.go\|samples/\|simd_lane_\|simd_off.go\|contact_solver_simd.go\|contact_solver_q32.go\|internal/q32gen/\|spin_asm.go\|spin_stub.go\|validate_debug.go\|validate_release.go\|pair_order_sorted.go\|pair_order_upstream.go'; then
            echo "unexpected build tags found"
            exit 1
          fi
          camera="$(cd samples && (grep -rln 'fixed\.' --include=*.go . | grep -v internal/draw/text.go || true))"
          if [ -n "$camera" ]; then
            printf 'Unexpected fixed imports in samples:\n%s\n' "$camera"
            exit 1
          fi
          epsilon="$(grep -chE 'scalarEpsilon|belowEpsilon|sensorOverlaps' aabb.go geometry.go distance.go manifold.go sensor.go world.go | paste -sd+ | bc)"
          if [ "$epsilon" != "23" ]; then
            echo "expected 23 epsilon references, got $epsilon"
            exit 1
          fi
          # b2ValidateSolverSets is empty unless B2_VALIDATE is set. The
          # mutation paths must reach it through validateSolverSetsDebug, or
          # a release build pays an O(bodies + joints + contacts) sweep per
          # joint.
          validate="$(grep -rln 'validateSolverSets(' --include=*.go . | grep -v '_test\.go' | grep -vE '^\./(world|validate_debug)\.go$' || true)"
          if [ -n "$validate" ]; then
            printf 'validateSolverSets must be reached through validateSolverSetsDebug:\n%s\n' "$validate"
            exit 1
          fi
      - name: Configure Wasm runner
        if: matrix.goarch == 'wasm'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      # Fixed mode runs the scene traces past the timeout where the target is
      # slow: 386, wasm, and the generic wide lanes. -short drops the scene
      # traces only, so the function traces still run, and fixed mode is
      # bit-identical across these targets anyway. Float stays whole
      # everywhere, wasm included; its scene traces fit and it is the job that
      # sees the wasm heap bug.
      - name: Test
        run: go test -timeout 600s ${{ (contains(matrix.tags, 'dbox2d_fixed') && (matrix.goarch == '386' || matrix.goarch == 'wasm' || contains(matrix.tags, 'dbox2d_simd'))) && '-short' || '' }} -tags "${{ matrix.tags }}" ./...
      # The gated validation is off in every other job, so it needs one job
      # that actually runs it.
      - name: Test with the solver-set validation on
        if: matrix.goarch == 'amd64' && matrix.tags == ''
        run: go test -timeout 600s -tags dbox2d_validate ./...
      # With the pair order of the reference (D-013), float mode must match
      # every conformance scene bit for bit.
      - name: Test with the upstream pair order
        if: (matrix.goarch == 'amd64' || matrix.goarch == 'arm64') && (matrix.tags == '' || matrix.tags == 'dbox2d_simd')
        run: go test -timeout 600s -tags "${{ matrix.tags }},dbox2d_upstream_pairs" ./...

  wide:
    name: wide (${{ matrix.path }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        path: [avx2, neon, simd128]
        mode: [float, fixed]
        include:
          - os: ubuntu-latest
            path: avx2
            fma: 'VFN?M(ADD|SUB)'
            goos: ""
            goarch: ""
          - os: ubuntu-24.04-arm
            path: neon
            fma: '\b(FMADD|FMSUB|FNMADD|FNMSUB|FMLA|FMLS|VFMLA|VFMLS)S?\b'
            goos: ""
            goarch: ""
          - os: ubuntu-latest
            path: simd128
            goos: js
            goarch: wasm
          - mode: float
            tags: dbox2d_simd
          - mode: fixed
            tags: dbox2d_simd,dbox2d_fixed,fixed_satcounter
          # fixed has no simd128 lanes; its wasm build runs the generic lanes.
          - path: simd128
            mode: fixed
            lanes: generic
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
      TAGS: ${{ matrix.tags }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # the native host uses cgo; wasm must not try it.
      CGO_ENABLED: ${{ matrix.goos == 'js' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The archsimd API changes between Go releases. Pin the version the
          # wide lanes were written against.
          go-version: "1.27.0"
      - name: Configure Wasm runner
        if: matrix.goos == 'js'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      - name: Path
        shell: bash
        run: |
          go test -tags $TAGS -run TestWidePath -v . | tee /dev/stderr | grep -q 'path: ${{ matrix.lanes || matrix.path }}'
      - name: Vet
        run: go vet -tags $TAGS ./...
      - name: Guard the float lanes
        if: matrix.mode == 'float' && matrix.fma
        shell: bash
        run: |
          count="$(go build -tags $TAGS -gcflags=-S . 2>&1 | grep -cE '${{ matrix.fma }}' || true)"
          if [ "$count" != "0" ]; then
            echo "expected no fused multiply-add instructions, got $count"
            exit 1
          fi
      - name: Test
        # The scene traces take minutes on wasm; the native paths run them.
        run: go test -timeout 600s ${{ matrix.goos == 'js' && '-short' || '' }} -tags $TAGS ./...

  samples:
    name: samples (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [float, fixed, float-simd, fixed-simd]
        include:
          - mode: float
            tags: ""
          - mode: fixed
            tags: dbox2d_fixed
          # The SIMD family pins the toolchain of the wide job.
          - mode: float-simd
            tags: dbox2d_simd
            go: "1.27.0"
            experiment: simd
          - mode: fixed-simd
            tags: dbox2d_simd,dbox2d_fixed
            go: "1.27.0"
            experiment: simd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples
    env:
      GOEXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          go-version-file: ${{ !matrix.go && 'samples/go.mod' || '' }}
      # The native host needs cgo and the GLFW system libraries, which this
      # runner does not carry, so the portable packages are named one by one.
      - name: Vet
        run: go vet -tags "${{ matrix.tags }}" . ./internal/app ./internal/draw
      # cmd/web is the target pages.yml deploys, and it builds only on js/wasm.
      - name: Vet the web build
        run: go vet -tags "${{ matrix.tags }}" ./cmd/web
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
      # The module carries no tests of its own yet; this runs them once it does.
      - name: Test
        run: go test -timeout 600s -tags "${{ matrix.tags }}" . ./internal/app ./internal/draw

  race:
    name: race (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race the executor
        run: go test -race -timeout 300s -run 'WorkerCount|ParallelFor|Executor|SideTask|Sensor|Counters|PendingSplit' .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        name: Lint float mode
        with:
          version: latest
      - uses: golangci/golangci-lint-action@v8
        name: Lint fixed mode
        with:
          version: latest
          args: --build-tags dbox2d_fixed ./...
