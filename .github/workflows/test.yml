name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goos: linux
            runner: ubuntu-latest
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
          - goarch: "386"
            goos: linux
            runner: ubuntu-latest
          - goarch: wasm
            goos: js
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.goarch == 'amd64'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        if: matrix.goarch == 'amd64'
        run: go vet ./...
      - name: Guard the scalar layer
        if: matrix.goarch == 'amd64' || matrix.goarch == 'wasm'
        shell: bash
        run: |
          leaks="$(grep -rlE 'fixed\.(Q32(Zero|One|Half|FromInt|FromRatio|MustParse|MaxValue|MinValue)|RotIdentity|RotFromTurns|Atan2Turns)\(' --include=*.go --exclude=scalar_fixed.go --exclude=probe_q16_test.go --exclude=probe_wide_test.go . || true)"
          if [ -n "$leaks" ]; then
            printf 'Files bypass the scalar layer:\n%s\n' "$leaks"
            exit 1
          fi
          # MakeRot stays out of the count: its body costs 83, over the budget of 80, since before the layer.
          inlined="$(go build -gcflags=-m=1 . 2>&1 | grep -cE 'can inline (QZero|QOne|QHalf|QFromInt|QFromRatio|QMustParse|QMaxValue|QMinValue|RotIdentity|atan2Turns)$')"
          if [ "$inlined" != "10" ]; then
            echo "expected 10 inlinable constructors, got $inlined"
            exit 1
          fi
          if go build -tags dbox2d_float . 2>/dev/null; then
            echo "the dbox2d_float tag must not build yet"
            exit 1
          fi
      - name: Configure Wasm runner
        if: matrix.goarch == 'wasm'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      - name: Test
        run: go test -timeout 120s ./...

  race:
    name: race (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race the executor
        run: go test -race -timeout 300s -run 'WorkerCount|ParallelFor|Executor|SideTask|Sensor|Counters|PendingSplit' .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
