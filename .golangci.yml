version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      # QF1001 rewrites a negated disjunction. The port keeps the boolean
      # expressions of the reference, so that each function stays comparable
      # to its upstream counterpart line by line.
      # The ST entries below are the default set of the linter. ST1003 would
      # rename WorldId to WorldID and lose the upstream name.
      checks:
        - all
        - -QF1001
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    rules:
      # internal/shared is shared/ of the reference, and it dot-imports the
      # library so that each scene builder reads as its C counterpart does.
      - path: internal/shared/
        linters:
          - staticcheck
        text: ST1001
