version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      # QF1001 rewrites a negated disjunction. The port keeps the boolean
      # expressions of the reference, so that each function stays comparable
      # to its upstream counterpart line by line.
      # The ST entries below are the default set of the linter. ST1003 would
      # rename WorldId to WorldID and lose the upstream name.
      checks:
        - all
        - -QF1001
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # A struct mirrors its upstream layout in full, so a field can land
      # before the module that reads it arrives. This keeps the layout from
      # drifting away from the reference.
      - linters:
          - unused
        text: "field .* is unused"
